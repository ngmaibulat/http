name: Release

on:
  push:
    tags: ['v*']

jobs:
  publish:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write # required for npm trusted publishing (OIDC) and provenance

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '26'
          registry-url: https://registry.npmjs.org
          cache: npm

      - run: npm ci

      - run: npm run typecheck

      - run: npm test

      - run: npm run test:dist

      # Auth comes from the job's OIDC identity, matched against the trusted
      # publisher configured on npmjs.com for this package. No NPM_TOKEN.
      - run: npm publish --provenance --access public
